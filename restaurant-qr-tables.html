<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12345a"><title>رموز طاولات المطعم | HA</title>
<style>
:root{--navy:#12345a;--blue:#1769aa;--teal:#0b9e98;--bg:#f2f7fb;--ink:#18324a;--muted:#718397;--line:#dce7ef;--red:#a53636}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,Arial}button,input{font:inherit}.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;color:var(--navy);font-weight:800}.wrap{max-width:1000px;margin:24px auto;padding:0 14px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 10px 25px #17395a0c}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{display:grid;gap:6px;flex:1;min-width:180px}.field input{border:1px solid var(--line);border-radius:11px;padding:10px 12px;min-height:43px}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--teal);color:white;font-weight:750;cursor:pointer}.btn.alt{background:#e9f1f6;color:#29465e}.btn.danger{background:#fff0ef;color:var(--red)}.hint{font-size:13px;color:var(--muted)}.message{padding:10px 12px;border-radius:10px;background:#eff7fc;color:#3f6078;margin-top:12px}.message.error{background:#fff1ef;color:#9b3830}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.table-card{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;justify-items:center;gap:8px;text-align:center}.table-card h3{margin:0;color:var(--navy)}.table-card canvas{max-width:100%;height:auto}.url{font-size:11px;word-break:break-all;color:var(--muted);direction:ltr;text-align:left}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.hidden{display:none!important}@media print{.top,.noprint{display:none!important}body{background:white}.wrap{margin:0;max-width:none}.panel{box-shadow:none;border:0;padding:0}.table-card{break-inside:avoid}}
</style></head>
<body><header class="top">HA · رموز طاولات المطعم <span id="spaceName"></span></header>
<main class="wrap"><section id="loading" class="panel">جارٍ التحقق من صلاحية مالك المطعم…</section><section id="manager" class="hidden">
<div class="panel"><h2>إضافة طاولة</h2><p class="hint">اكتب رقم الطاولة أو اسمها. ينشأ لها رابط خاص ورمز QR للطباعة.</p><form id="addForm" class="row noprint"><label class="field">اسم أو رقم الطاولة<input name="label" required maxlength="40" placeholder="مثال: طاولة 1"></label><button class="btn">إنشاء الرمز</button><button type="button" class="btn alt" onclick="print()">طباعة الكل</button></form><div id="message" class="message hidden"></div></div>
<div class="panel"><h2>طاولات المطعم</h2><div id="tableList" class="list"><p class="hint">جارٍ تحميل الطاولات…</p></div></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script src="./supabase-config.js"></script>
<script>
(()=>{'use strict';const q=new URLSearchParams(location.search),rid=q.get('restaurant_id'),cfg=window.HA_SUPABASE_CONFIG||{},db=window.supabase?.createClient&&cfg.url&&cfg.publishableKey?window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}}):null,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),publicUrl=t=>new URL('./restaurant-qr-menu.html',location.href).href+'?t='+encodeURIComponent(t);
function msg(text,error=false){let e=$('#message');e.textContent=text;e.className='message'+(error?' error':'');e.classList.remove('hidden');}
async function render(){let {data,error}=await db.from('ha_restaurant_qr_tables').select('*').eq('restaurant_id',rid).order('table_label');if(error)throw error;let host=$('#tableList');if(!data?.length){host.innerHTML='<p class="hint">ما أضفت طاولات بعد.</p>';return;}host.innerHTML=data.map(t=>`<article class="table-card"><h3>${esc(t.table_label)}</h3><canvas id="qr-${esc(t.id)}" width="200" height="200"></canvas><div class="hint">امسح الرمز لفتح المنيو</div><div class="url">${esc(publicUrl(t.public_token))}</div><div class="actions noprint"><button class="btn alt" data-print="${esc(t.id)}">طباعة الرمز</button><button class="btn danger" data-rotate="${esc(t.id)}">تغيير الرابط</button></div></article>`).join('');for(const t of data){let canvas=$('#qr-'+CSS.escape(t.id));try{if(window.QRCode)await QRCode.toCanvas(canvas,publicUrl(t.public_token),{width:200,margin:1,errorCorrectionLevel:'M'});else canvas.replaceWith(Object.assign(document.createElement('p'),{textContent:'افتح الرابط وأنشئ منه QR'}));}catch(e){console.warn(e);}}
}
async function start(){if(!db||!rid)throw new Error('إعداد قاعدة البيانات أو معرّف المطعم غير موجود.');let {data:{session}}=await db.auth.getSession();if(!session){location.href='./restaurant-orders.html';return;}let {data:membership,error}=await db.from('ha_restaurant_staff').select('role,ha_restaurant_spaces(name)').eq('restaurant_id',rid).eq('user_id',session.user.id).eq('active',true).maybeSingle();if(error)throw error;if(membership?.role!=='owner')throw new Error('هذه الصفحة مخصصة لمالك المطعم.');$('#spaceName').textContent=' · '+(membership.ha_restaurant_spaces?.name||'');$('#loading').classList.add('hidden');$('#manager').classList.remove('hidden');await render();}
$('#addForm').onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;try{let {data,error}=await db.rpc('ha_restaurant_qr_add_table',{p_restaurant_id:rid,p_table_label:new FormData(e.currentTarget).get('label').trim()});if(error)throw error;e.currentTarget.reset();msg('تم إنشاء QR للطاولة. اطبعه وثبّته على الطاولة.');await render();}catch(x){msg(x.message||'تعذر إنشاء الطاولة.',true);}finally{b.disabled=false;}};
$('#tableList').onclick=async e=>{let p=e.target.closest('[data-print]');if(p){let card=p.closest('.table-card');document.querySelectorAll('.table-card').forEach(x=>x.classList.add('print-hide'));card.classList.remove('print-hide');window.print();document.querySelectorAll('.table-card').forEach(x=>x.classList.remove('print-hide'));return;}let r=e.target.closest('[data-rotate]');if(r&&confirm('تغيير رابط هذه الطاولة؟ الرمز القديم سيتوقف عن العمل.')){r.disabled=true;let {error}=await db.rpc('ha_restaurant_qr_rotate_table',{p_table_id:r.dataset.rotate});if(error)msg(error.message,true);else{msg('تم تغيير الرابط. اطبع QR الجديد وأزل الرمز القديم.');await render();}}};
window.addEventListener('afterprint',()=>document.querySelectorAll('.table-card').forEach(x=>x.classList.remove('print-hide')));let style=document.createElement('style');style.textContent='@media print{.table-card.print-hide{display:none!important}}';document.head.append(style);start().catch(e=>{$('#loading').textContent=e.message||'تعذر فتح إدارة الطاولات.';});
})();
</script></body></html>
