<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12345a">
<title>طلبات المطعم | HA</title>
<style>
:root{--navy:#12345a;--blue:#1769aa;--teal:#0b9e98;--mint:#e7f8f5;--bg:#f2f7fb;--ink:#18324a;--muted:#718397;--line:#dce7ef;--red:#c64747;--gold:#b87808;--green:#168263;--shadow:0 12px 30px #17395a12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.shell{max-width:1200px;margin:auto;padding:18px}.topbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 18px #16324a0b}.topinner{max-width:1200px;margin:auto;padding:12px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--navy)}.brandmark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#ffbc57,#ff7952);display:grid;place-items:center;color:white;font-weight:900}.top-actions,.toolbar,.tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 14px;background:var(--teal);color:#fff;font-weight:750}.btn:hover{filter:brightness(.97)}.btn.secondary{background:#e9f1f6;color:#29465e}.btn.danger{background:#fff0ef;color:#a53636}.btn.small{padding:7px 10px;font-size:13px}.btn:disabled{opacity:.5;cursor:not-allowed}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.panel-head h2,.card h2{font-size:18px;margin:0;color:var(--navy)}.muted,.hint{color:var(--muted);font-size:13px}.grid{display:grid;gap:14px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:750;color:#405b71}.input,.field input,.field select,.field textarea{width:100%;border:1px solid #d8e3eb;border-radius:11px;padding:10px 12px;background:#fff;color:var(--ink);min-height:42px}.field textarea{min-height:76px;resize:vertical}.notice{border-radius:12px;padding:12px;background:#eff7fc;color:#3f6078;border:1px solid #dcebf4;font-size:13px}.error{background:#fff1ef;border-color:#f1d0cc;color:#9b3830}.success{background:#e9f8f0;border-color:#ccebdd;color:#19724f}.login-wrap{max-width:430px;margin:7vh auto}.login-wrap .card{padding:24px}.tabs{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}.tab{border:1px solid var(--line);background:#fff;color:#3e5a70;border-radius:999px;padding:8px 13px;font-weight:700}.tab.active{background:var(--navy);border-color:var(--navy);color:#fff}.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.menu-item{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;display:grid;gap:6px;text-align:right;min-height:110px}.menu-item:hover{border-color:var(--teal);box-shadow:0 4px 14px #0b9e9818}.menu-item strong{font-size:15px}.price{color:var(--blue);font-weight:850}.order-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:15px}.cart-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.qty-tools{display:flex;gap:5px;align-items:center}.qty-tools button{border:0;border-radius:8px;padding:4px 9px;background:#eaf3f8;color:var(--navy);font-weight:800}.order-list{display:grid;gap:12px}.order-card{border:1px solid var(--line);border-right:5px solid var(--blue);border-radius:14px;padding:14px;background:#fff}.order-card.status-new{border-right-color:var(--gold)}.order-card.status-preparing{border-right-color:#7f58bc}.order-card.status-ready{border-right-color:var(--teal)}.order-card.status-paid{border-right-color:var(--green)}.order-title{display:flex;justify-content:space-between;gap:10px;align-items:center}.order-title strong{font-size:18px;color:var(--navy)}.badge{border-radius:999px;padding:4px 9px;background:#eff4f7;font-size:12px;font-weight:800}.badge.new{background:#fff3dc;color:#946106}.badge.preparing{background:#f1eaff;color:#6646a1}.badge.ready{background:#e5f8f4;color:#08796e}.badge.paid{background:#e7f7ee;color:#167452}.order-items{margin:10px 0;padding:9px 12px;background:#f7fafc;border-radius:10px}.order-line{display:flex;justify-content:space-between;gap:8px;padding:3px 0}.staff-row{display:grid;grid-template-columns:1fr 160px auto;gap:8px;align-items:center}.section{margin:16px 0}.total{font-size:20px;color:var(--navy);font-weight:900}.offline-indicator{font-size:12px;color:var(--muted)}@media(max-width:760px){.shell{padding:12px}.topinner{padding:10px 12px}.two,.three,.order-layout{grid-template-columns:1fr}.card,.panel{padding:14px}.staff-row{grid-template-columns:1fr}.brand small{display:none}}
</style>
</head>
<body>
<header class="topbar"><div class="topinner"><div class="brand"><span class="brandmark">HA</span><span>طلبات المطعم<small class="muted" id="spaceName"></small></span></div><div class="top-actions"><span class="offline-indicator" id="connectionState">يتحقق من الاتصال…</span><select class="input hidden" id="spaceSelect" style="width:auto;min-width:150px"></select><button class="btn secondary small hidden" id="logoutBtn">خروج</button></div></div></header>
<main class="shell">
<section id="loginView" class="login-wrap hidden"><div class="card"><h2>دخول الموظفين</h2><p class="muted">استخدم حسابك الموجود في Supabase.</p><form id="loginForm" class="grid"><div class="field"><label>البريد أو المعرّف</label><input class="input" id="loginId" autocomplete="username" required></div><div class="field"><label>كلمة المرور</label><input class="input" id="loginPassword" type="password" autocomplete="current-password" required></div><button class="btn" id="loginBtn">دخول</button></form><p id="loginMessage" class="notice hidden"></p></div></section>
<section id="setupView" class="login-wrap hidden"><div class="card"><h2 id="setupTitle">جارٍ ربط حساب المطعم</h2><p id="setupMessage" class="muted">نتحقق من مساحة المطعم المرتبطة بحسابك…</p><form id="spaceForm" class="grid hidden"><div class="field"><label>اسم المطعم أو المقهى</label><input class="input" name="name" required maxlength="100" placeholder="مثال: مقهى النخيل"></div><button class="btn">إعداد المساحة</button></form><p class="hint hidden" id="setupHint">لن تحتاج إلى إنشاء حساب جديد.</p></div></section>
<section id="appView" class="hidden"><div class="tabs" id="roleTabs"></div><div id="mainPanel"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
<script src="./supabase-config.js"></script>
<script>
(()=>{'use strict';
const cfg=window.HA_SUPABASE_CONFIG||{};const db=window.supabase?.createClient&&cfg.url&&cfg.publishableKey?window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:0}).format(Number(n)||0)+' د.ع',fmtDate=s=>new Date(s).toLocaleString('ar-IQ',{dateStyle:'short',timeStyle:'short'}),labels={new:'جديد',preparing:'قيد التحضير',ready:'جاهز',paid:'مدفوع',cancelled:'ملغي'},roleLabels={owner:'مالك',waiter:'ويتر',kitchen:'مطبخ',cashier:'كاشير'};
let user=null,spaces=[],space=null,role=null,menu=[],orders=[],itemsByOrder={},cart=[],category='الكل',channel=null,view='',accountingProducts=[],recipeLines=[];
function say(el,text,kind='notice'){if(!el)return;el.className='notice '+kind;el.textContent=text;el.classList.remove('hidden');}
function hide(el){el.classList.add('hidden')}
function show(el){el.classList.remove('hidden')}
function connection(){ $('#connectionState').textContent=navigator.onLine?'متصل':'غير متصل — الإرسال الفوري يحتاج إنترنت'; }
window.addEventListener('online',connection);window.addEventListener('offline',connection);connection();
function loginEmail(raw){let s=String(raw||'').trim();return s.includes('@')?s:`${s.toLowerCase()}@ha-accounting.invalid`;}
function roleViews(){let list=[];if(role==='owner'||role==='waiter')list.push(['new','طلب جديد']);if(role==='owner'||role==='kitchen')list.push(['kitchen','المطبخ']);if(role==='owner'||role==='cashier')list.push(['cashier','الكاشير']);if(role==='owner')list.push(['manage','القائمة والموظفون']);return list;}
function switchView(next){view=next;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===view));if(view==='new')renderNew();else if(view==='kitchen')renderOrders('kitchen');else if(view==='cashier')renderOrders('cashier');else renderManage();}
function renderTabs(){let tabs=roleViews();$('#roleTabs').innerHTML=tabs.map(([id,label])=>`<button class="tab ${view===id?'active':''}" data-view="${id}">${label}</button>`).join('');$('#roleTabs').onclick=e=>{let b=e.target.closest('[data-view]');if(b)switchView(b.dataset.view);};if(!tabs.some(x=>x[0]===view))view=tabs[0]?.[0]||'';switchView(view);}
async function ensureRestaurantModule(){let {data:admin,error:adminError}=await db.from('super_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(adminError)throw adminError;if(admin)return;let {data:sub,error}=await db.from('subscriptions').select('active,expires_at,module_type').eq('user_id',user.id).maybeSingle();if(error)throw error;if(!sub||!sub.active||(sub.expires_at&&new Date(sub.expires_at).getTime()<Date.now()))throw new Error('حسابك غير مفعّل. راجع الأدمن الرئيسي.');if(!['restaurant','full'].includes(sub.module_type||'full'))throw new Error('هذا الحساب غير مخصص للمطاعم. اطلب من الأدمن تفعيل قسم المطاعم.');}
async function loadMemberships(){let {data,error}=await db.from('ha_restaurant_staff').select('restaurant_id,role,ha_restaurant_spaces(id,name)').eq('user_id',user.id).eq('active',true);if(error)throw error;spaces=(data||[]).map(x=>({id:x.restaurant_id,role:x.role,space:Array.isArray(x.ha_restaurant_spaces)?x.ha_restaurant_spaces[0]:x.ha_restaurant_spaces})).filter(x=>x.space);if(!spaces.length){hide($('#loginView'));hide($('#appView'));show($('#setupView'));$('#setupTitle').textContent='جارٍ ربط حساب المطعم';$('#setupMessage').textContent='حسابك مفعّل للمطاعم. نجهّز مساحة الطلبات تلقائياً باسم المنشأة.';try{let {data:workspace,error:workspaceError}=await db.from('accounting_workspaces').select('data').eq('user_id',user.id).maybeSingle();if(workspaceError)throw workspaceError;let name=String(workspace?.data?.company?.name||user.user_metadata?.company_name||user.user_metadata?.name||'').trim();if(!name||name==='شركتي')name='مطعم '+String(user.email||'').split('@')[0].replace(/[^\p{L}\p{N} _-]/gu,'').slice(0,70);if(!name||name==='مطعم')name='مطعمي';let created=await db.rpc('ha_restaurant_create_space',{p_name:name.slice(0,100)});if(created.error)throw created.error;let retry=await db.from('ha_restaurant_staff').select('restaurant_id,role,ha_restaurant_spaces(id,name)').eq('user_id',user.id).eq('active',true);if(retry.error)throw retry.error;spaces=(retry.data||[]).map(x=>({id:x.restaurant_id,role:x.role,space:Array.isArray(x.ha_restaurant_spaces)?x.ha_restaurant_spaces[0]:x.ha_restaurant_spaces})).filter(x=>x.space);if(!spaces.length)throw new Error('تم إعداد المساحة لكن لم يظهر ربط المالك. أعد تحميل الصفحة أو راجع إعداد قاعدة البيانات.');}catch(err){$('#setupTitle').textContent='تعذر الربط التلقائي';$('#setupMessage').textContent='حسابك موجود ومفعّل، لكن قاعدة بيانات طلبات المطعم لم تُكمل الربط. لا تنشئ حساباً جديداً؛ جرّب الإعداد اليدوي مرة واحدة أو أرسل رسالة الخطأ للأدمن.';show($('#spaceForm'));show($('#setupHint'));$('#setupHint').textContent=err.message||'تحقق من تشغيل إعدادات طلبات المطاعم في Supabase.';return;}}hide($('#setupView'));hide($('#loginView'));show($('#appView'));$('#logoutBtn').classList.remove('hidden');if(spaces.length>1){$('#spaceSelect').innerHTML=spaces.map(x=>`<option value="${esc(x.id)}">${esc(x.space.name)} · ${roleLabels[x.role]||x.role}</option>`).join('');show($('#spaceSelect'));$('#spaceSelect').onchange=()=>selectSpace($('#spaceSelect').value);}await selectSpace(spaces[0].id);}
async function selectSpace(id){let m=spaces.find(x=>x.id===id);if(!m)return;space=m.space;role=m.role;$('#spaceName').textContent=' · '+space.name;renderTabs();await refreshOrders();await loadMenu();if(role==='owner'){await loadAccountingProducts();await loadRecipeLines();if(view==='manage')renderManage();}subscribe();}
async function loadAccountingProducts(){accountingProducts=[];let {data,error}=await db.from('accounting_workspaces').select('data').eq('user_id',user.id).maybeSingle();if(error){console.warn('تعذر تحميل أصناف المحاسبة للوصفات',error);return;}accountingProducts=Array.isArray(data?.data?.products)?data.data.products:[];}
async function loadRecipeLines(){let {data,error}=await db.from('ha_restaurant_recipe_lines').select('*').eq('restaurant_id',space.id);if(error)throw error;recipeLines=data||[];}
async function loadMenu(){let {data,error}=await db.from('ha_restaurant_menu').select('*').eq('restaurant_id',space.id).eq('active',true).order('category').order('name');if(error)throw error;menu=data||[];if(view==='new')renderNew();if(view==='manage')renderManage();}
async function refreshOrders(){if(!space)return;let {data,error}=await db.from('ha_restaurant_orders').select('*').eq('restaurant_id',space.id).order('created_at',{ascending:false}).limit(100);if(error)throw error;orders=data||[];itemsByOrder={};let ids=orders.map(x=>x.id);if(ids.length){let res=await db.from('ha_restaurant_order_items').select('*').in('order_id',ids);if(res.error)throw res.error;for(const row of res.data||[])(itemsByOrder[row.order_id]??=[]).push(row);}if(view==='kitchen'||view==='cashier')renderOrders(view);else if(view==='new'){let host=$('#openOrderList');if(host)host.innerHTML=orderCards(orders.filter(x=>['new','preparing','ready'].includes(x.status)))||'<p class="muted">ماكو طلبات مفتوحة.</p>'; }}
function subscribe(){if(channel)db.removeChannel(channel);channel=db.channel('ha-restaurant-'+space.id).on('postgres_changes',{event:'*',schema:'public',table:'ha_restaurant_orders',filter:`restaurant_id=eq.${space.id}`},()=>refreshOrders().catch(console.error)).subscribe();}
function categories(){return ['الكل',...new Set(menu.map(x=>x.category||'عام'))];}
function renderNew(){if(!space)return;let cats=categories();if(!cats.includes(category))category='الكل';let active=menu.filter(x=>category==='الكل'||(x.category||'عام')===category);$('#mainPanel').innerHTML=`<div class="order-layout"><section class="panel"><div class="panel-head"><h2>اختيار الأصناف</h2><span class="muted">${esc(roleLabels[role])}</span></div><div class="tabs">${cats.map(c=>`<button class="tab ${category===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="menu-grid">${active.map(m=>`<button class="menu-item" data-add="${m.id}"><strong>${esc(m.name)}</strong><span class="muted">${esc(m.category||'عام')}</span><span class="price">${money(m.price)}</span></button>`).join('')||'<p class="muted">القائمة فارغة. اطلب من المالك إضافة الأصناف.</p>'}</div></section><section class="panel"><div class="panel-head"><h2>الطلب الحالي</h2><button class="btn danger small" id="clearCart">تفريغ</button></div><div class="field"><label>رقم الطاولة</label><input class="input" id="tableLabel" placeholder="مثال: 4 أو سفري"></div><div class="field section"><label>ملاحظة عامة</label><input class="input" id="orderNote" placeholder="مثال: الطلب مستعجل"></div><div id="cartList"></div><div class="panel-head section"><span>الإجمالي</span><strong class="total" id="cartTotal">0</strong></div><button class="btn" id="sendOrder" style="width:100%" ${cart.length?'':'disabled'}>إرسال للمطبخ والكاشير</button><p id="orderMessage" class="notice hidden"></p></section></div><section class="panel section"><div class="panel-head"><h2>الطلبات المفتوحة</h2><button class="btn secondary small" id="refreshBtn">تحديث</button></div><div class="order-list" id="openOrderList">${orderCards(orders.filter(x=>['new','preparing','ready'].includes(x.status)))||'<p class="muted">ماكو طلبات مفتوحة.</p>'}</div></section>`;
$('#mainPanel').onclick=async e=>{let c=e.target.closest('[data-cat]');if(c){category=c.dataset.cat;renderNew();return;}let add=e.target.closest('[data-add]');if(add){let m=menu.find(x=>x.id===add.dataset.add);if(m){let line=cart.find(x=>x.menu.id===m.id);if(line)line.qty++;else cart.push({menu:m,qty:1,note:''});renderNew();}return;}if(e.target.closest('#clearCart')){cart=[];renderNew();return;}if(e.target.closest('#refreshBtn')){refreshOrders().catch(err=>alert(err.message));return;}let remove=e.target.closest('[data-cart-remove]');if(remove){cart.splice(+remove.dataset.cartRemove,1);renderNew();return;}let adjust=e.target.closest('[data-cart-adjust]');if(adjust){let [i,d]=adjust.dataset.cartAdjust.split(':').map(Number);cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);renderNew();return;}if(e.target.closest('#sendOrder'))await sendOrder();};
$('#cartList').innerHTML=cart.map((x,i)=>`<div class="cart-row"><div><b>${esc(x.menu.name)}</b><div class="muted">${money(x.menu.price)} × ${x.qty}</div><input class="input" style="margin-top:6px" data-cart-note="${i}" value="${esc(x.note)}" placeholder="ملاحظة للصنف"></div><div class="qty-tools"><button data-cart-adjust="${i}:-1">−</button><b>${x.qty}</b><button data-cart-adjust="${i}:1">+</button><button class="btn danger small" data-cart-remove="${i}">×</button></div></div>`).join('')||'<p class="muted">اختَر الأصناف من القائمة.</p>';
$('#cartList').oninput=e=>{let n=e.target.closest('[data-cart-note]');if(n)cart[+n.dataset.cartNote].note=n.value;};$('#cartTotal').textContent=money(cart.reduce((s,x)=>s+x.qty*Number(x.menu.price),0));}
async function sendOrder(){if(!navigator.onLine){say($('#orderMessage'),'ما نكدر نرسل الطلب للمطبخ بدون إنترنت. خليه مسودة وأرسله بعد رجوع الاتصال.','error');return;}let table=$('#tableLabel').value.trim();if(!table){say($('#orderMessage'),'اكتب رقم الطاولة أو اسم طلب السفري.','error');return;}if(!cart.length){say($('#orderMessage'),'أضف صنفاً واحداً على الأقل.','error');return;}let b=$('#sendOrder');b.disabled=true;try{let {data,error}=await db.rpc('ha_restaurant_create_order',{p_restaurant_id:space.id,p_table_label:table,p_note:$('#orderNote').value.trim(),p_items:cart.map(x=>({menu_item_id:x.menu.id,qty:x.qty,note:x.note}))});if(error)throw error;cart=[];say($('#orderMessage'),'وصل الطلب للمطبخ والكاشير. رقم الطلب: '+data,'success');$('#tableLabel').value='';$('#orderNote').value='';await refreshOrders();renderNew();say($('#orderMessage'),'وصل الطلب للمطبخ والكاشير. رقم الطلب: '+data,'success');}catch(err){say($('#orderMessage'),err.message||'تعذر إرسال الطلب.','error');}finally{b.disabled=false;}}
function orderCards(list){return list.map(o=>{let lines=itemsByOrder[o.id]||[];let buttons='';if(role==='kitchen'&&o.status==='new')buttons=`<button class="btn" data-status="${o.id}:preparing">بدء التحضير</button>`;if(role==='kitchen'&&o.status==='preparing')buttons=`<button class="btn" data-status="${o.id}:ready">الطلب جاهز</button>`;if(role==='cashier'&&o.status==='ready')buttons=`<button class="btn" data-status="${o.id}:paid">استلام الحساب وإنشاء فاتورة</button>`;if(role==='waiter'&&o.status==='new')buttons=`<button class="btn danger small" data-status="${o.id}:cancelled">إلغاء الطلب</button>`;if(role==='owner')buttons=`<div class="toolbar">${o.status==='new'?`<button class="btn small" data-status="${o.id}:preparing">بدء التحضير</button>`:''}${o.status==='preparing'?`<button class="btn small" data-status="${o.id}:ready">جاهز</button>`:''}${o.status==='ready'?`<button class="btn small" data-status="${o.id}:paid">استلام الحساب وإنشاء فاتورة</button>`:''}${['new','preparing'].includes(o.status)?`<button class="btn danger small" data-status="${o.id}:cancelled">إلغاء</button>`:''}</div>`;return `<article class="order-card status-${esc(o.status)}"><div class="order-title"><strong>طاولة ${esc(o.table_label)}</strong><span class="badge ${esc(o.status)}">${labels[o.status]||o.status}</span></div><div class="muted">${fmtDate(o.created_at)} · طلب ${esc(String(o.id).slice(0,8))}</div><div class="order-items">${lines.map(i=>`<div class="order-line"><span>${esc(i.item_name)} × ${i.quantity}${i.note?`<small class="muted"> — ${esc(i.note)}</small>`:''}</span><b>${money(i.line_total)}</b></div>`).join('')||'<span class="muted">جار تحميل الأصناف…</span>'}${o.note?`<p class="muted">ملاحظة: ${esc(o.note)}</p>`:''}</div><div class="panel-head"><span>الإجمالي</span><b class="total">${money(o.total)}</b></div>${buttons}</article>`;}).join('');}
function renderOrders(kind){if(!space)return;let allowed=kind==='kitchen'?['new','preparing','ready']:kind==='cashier'?['new','preparing','ready','paid']:['new','preparing','ready'];let list=orders.filter(o=>allowed.includes(o.status));$('#mainPanel').innerHTML=`<section class="panel"><div class="panel-head"><h2>${kind==='kitchen'?'شاشة المطبخ':'طلبات الكاشير'}</h2><button class="btn secondary small" id="refreshBtn">تحديث</button></div><div class="notice">تتحدث الطلبات تلقائياً عند وصول طلب جديد أو تغيير حالته.</div><div class="order-list section">${orderCards(list)||'<p class="muted">ماكو طلبات حالياً.</p>'}</div></section>`;$('#mainPanel').onclick=async e=>{if(e.target.closest('#refreshBtn')){await refreshOrders();return;}let x=e.target.closest('[data-status]');if(!x)return;let [order_id,status]=x.dataset.status.split(':');x.disabled=true;let response=status==='paid'?await db.rpc('ha_restaurant_pay_order',{p_order_id:order_id}):await db.rpc('ha_restaurant_set_order_status',{p_order_id:order_id,p_status:status});if(response.error){alert(response.error.message);x.disabled=false;}else{if(status==='paid')alert('تم استلام الحساب وإنشاء فاتورة '+response.data+' وتحديث المخزون.');await refreshOrders();}};}
function renderManage(){if(role!=='owner')return;let items=menu.map(x=>{let lines=recipeLines.filter(r=>r.menu_item_id===x.id),recipe=lines.map(r=>{let p=accountingProducts.find(z=>z.id===r.product_id);return `<div class="cart-row"><div>${esc(p?.name||'صنف محذوف من المخزون')} <span class="muted">× ${r.quantity_per_item} ${esc(p?.unit||'وحدة')}</span></div><button class="btn danger small" data-recipe-delete="${r.id}">حذف</button></div>`;}).join('');let options=accountingProducts.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · متاح ${Number(p.qty)||0} ${esc(p.unit||'')}</option>`).join('');return `<article class="card section"><div class="panel-head"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.category||'عام')} · ${money(x.price)}</div></div><button class="btn danger small" data-menu-delete="${x.id}">حذف الصنف</button></div><div class="muted">مكونات المخزون لكل حصة</div>${recipe||'<p class="muted">لا توجد مكونات؛ لا يمكن إغلاق الطلب قبل ربط الوصفة.</p>'}<form class="staff-row section" data-recipe-form="${x.id}"><select class="input" name="product_id" required>${options||'<option value="">أضف أصنافاً للمخزون أولاً</option>'}</select><input class="input" name="quantity_per_item" type="number" min="0.001" step="0.001" placeholder="الكمية لكل حصة" required><button class="btn secondary small" ${accountingProducts.length?'':'disabled'}>إضافة مكوّن</button></form></article>`;}).join('');$('#mainPanel').innerHTML=`<div class="grid two"><section class="panel"><div class="panel-head"><h2>إضافة صنف للقائمة</h2></div><form id="menuForm" class="grid"><div class="field"><label>اسم الصنف</label><input class="input" name="name" required></div><div class="field"><label>القسم</label><input class="input" name="category" placeholder="مشروبات، أكلات"></div><div class="field"><label>السعر</label><input class="input" name="price" type="number" min="0" step="1" required></div><button class="btn">حفظ الصنف</button></form><div class="notice section">اربط كل أكلة بمكوناتها من مخزون المحاسبة (مثلاً خبز 1، لحم 0.15 كغم). يخصم النظام الكمية عند إنشاء الفاتورة بعد الدفع.</div><div class="section">${items||'<p class="muted">القائمة فارغة.</p>'}</div></section><section class="panel"><div class="panel-head"><h2>إضافة موظف</h2></div><p class="muted">أنشئ حساب الموظف أولاً في Supabase Authentication، ثم أدخل User ID الخاص به هنا.</p><form id="staffForm" class="grid"><div class="field"><label>User ID</label><input class="input" name="user_id" required placeholder="UUID من صفحة Authentication"></div><div class="field"><label>الدور</label><select class="input" name="role"><option value="waiter">ويتر</option><option value="kitchen">مطبخ</option><option value="cashier">كاشير</option></select></div><button class="btn">تفعيل الموظف</button></form><div class="notice section">رابط شاشة الطلبات: <code>restaurant-orders.html</code>. كل موظف يدخل بحسابه ويشوف الشاشة المخصصة لدوره.</div></section></div>`;$('#menuForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.currentTarget);let {error}=await db.from('ha_restaurant_menu').insert({restaurant_id:space.id,name:String(f.get('name')).trim(),category:String(f.get('category')||'عام').trim()||'عام',price:Number(f.get('price')),active:true});if(error)alert(error.message);else{e.target.reset();await loadMenu();}};document.querySelectorAll('[data-recipe-form]').forEach(form=>form.onsubmit=async e=>{e.preventDefault();let f=new FormData(e.currentTarget),{error}=await db.from('ha_restaurant_recipe_lines').insert({restaurant_id:space.id,menu_item_id:e.currentTarget.dataset.recipeForm,product_id:String(f.get('product_id')),quantity_per_item:Number(f.get('quantity_per_item'))});if(error){alert(error.message);return;}await loadRecipeLines();renderManage();});$('#staffForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.currentTarget);let {error}=await db.from('ha_restaurant_staff').upsert({restaurant_id:space.id,user_id:String(f.get('user_id')).trim(),role:f.get('role'),active:true},{onConflict:'restaurant_id,user_id'});if(error)alert(error.message);else{alert('تم تفعيل الموظف.');e.target.reset();}};$('#mainPanel').onclick=async e=>{let b=e.target.closest('[data-menu-delete]');if(b){if(!confirm('حذف هذا الصنف من القائمة؟'))return;let {error}=await db.from('ha_restaurant_menu').update({active:false}).eq('id',b.dataset.menuDelete);if(error)alert(error.message);else{await loadMenu();await loadRecipeLines();}return;}let r=e.target.closest('[data-recipe-delete]');if(r){let {error}=await db.from('ha_restaurant_recipe_lines').delete().eq('id',r.dataset.recipeDelete);if(error)alert(error.message);else{await loadRecipeLines();renderManage();}}};}
async function start(){if(!db){show($('#loginView'));say($('#loginMessage'),'إعداد Supabase غير موجود. تأكد من رفع supabase-config.js مع الموقع.','error');return;}let {data:{session}}=await db.auth.getSession();if(!session){show($('#loginView'));return;}user=session.user;try{await ensureRestaurantModule();await loadMemberships();}catch(err){show($('#appView'));say($('#mainPanel'),err.message||'تعذر تحميل صلاحيات الموظف.','error');}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();let b=$('#loginBtn');b.disabled=true;try{let {data,error}=await db.auth.signInWithPassword({email:loginEmail($('#loginId').value),password:$('#loginPassword').value});if(error)throw error;user=data.user;hide($('#loginView'));await ensureRestaurantModule();await loadMemberships();}catch(err){show($('#loginView'));say($('#loginMessage'),err.message||'فشل تسجيل الدخول.','error');}finally{b.disabled=false;}};
$('#spaceForm').onsubmit=async e=>{e.preventDefault();let b=e.currentTarget.querySelector('button');b.disabled=true;let {error}=await db.rpc('ha_restaurant_create_space',{p_name:String(new FormData(e.target).get('name')).trim()});if(error){$('#setupHint').textContent=error.message;$('#setupHint').classList.remove('hidden');b.disabled=false;return;}await loadMemberships();b.disabled=false;};
$('#logoutBtn').onclick=async()=>{await db.auth.signOut();location.reload();};$('#spaceSelect').onchange=()=>selectSpace($('#spaceSelect').value);start().catch(err=>{show($('#loginView'));say($('#loginMessage'),err.message||'تعذر فتح الوحدة.','error');});
})();
</script>
