.pos-picker{margin:12px 0 17px;padding:13px;background:#f7fafb;border:1px solid var(--line);border-radius:13px}.pos-picker-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:11px}.pos-picker-head small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.pos-picker-tools{display:flex;gap:7px;min-width:min(420px,55%)}.pos-picker-tools input{min-width:0;flex:1}.pos-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;max-height:220px;overflow:auto;padding:2px}.pos-card{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:11px;background:#fff;border:1px solid #dce6ea;border-radius:11px;text-align:right;transition:.16s}.pos-card:hover:not(:disabled){border-color:var(--teal);box-shadow:0 5px 14px #159a8c20;transform:translateY(-1px)}.pos-card:disabled{opacity:.48;cursor:not-allowed}.pos-card-icon{align-self:flex-end;width:29px;height:29px;border-radius:9px;display:grid;place-items:center;color:#117e74;background:#e1f5f1;font-size:17px}.pos-card strong{font-size:12px;line-height:1.4}.pos-card small,.pos-card-stock{color:var(--muted);font-size:10px}.pos-card-price{font-weight:700;color:#117e74;font-size:12px}.pos-card-stock{margin-top:auto}@media(max-width:700px){.pos-grid{grid-template-columns:repeat(2,minmax(0,1fr));max-height:190px}.pos-picker-head{align-items:stretch;flex-direction:column}.pos-picker-tools{min-width:0;flex-direction:column}}

<body>
<div class="layout">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-mark">HA</div><div><strong>HA محاسبة</strong><small>نظام الإدارة المالية</small></div></div>
  <nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span>لوحة التحكم</button>
    <button data-page="journal"><span class="ico">≋</span>القيود اليومية</button>
    <button data-page="accounts"><span class="ico">◫</span>دليل الحسابات</button>
    <button data-page="sales"><span class="ico">↗</span>المبيعات والفواتير</button>
    <button data-page="purchases"><span class="ico">↙</span>المشتريات</button>
    <button data-page="installments"><span class="ico">◷</span>الأقساط والاستحقاقات</button>
    <button data-page="treasury"><span class="ico">▣</span>الصندوق والبنوك</button>
    <button data-page="inventory"><span class="ico">▤</span>المخزون</button>
    <button data-page="payroll"><span class="ico">♙</span>الموظفون والرواتب</button>
    <button data-page="contacts"><span class="ico">♙</span>الزبائن والمجهزون</button>
    <button data-page="reports"><span class="ico">▥</span>التقارير المالية</button>
    <button data-page="settings"><span class="ico">⚙</span>إعدادات الشركة</button>
  </nav>
  <div class="side-foot">مساحة عمل محاسبية مستقلة<br>تُحفظ بيانات هذا المتصفح على جهازك</div>
</aside>
<main class="main">
  <header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="mobile-menu" id="menuBtn">☰</button><div class="top-title" id="topTitle">لوحة التحكم</div></div><div class="top-actions"><span class="date-chip" id="today"></span><span class="user-chip"><span class="user-avatar">م</span><span id="companyShort">إدارة الشركة</span></span></div></header>

<script>
(()=>{
const KEY='ha-accounting-v1';
const accountSeed=[
 {code:'1101',name:'الصندوق',type:'asset',sub:'نقدية'}, {code:'1102',name:'المصرف',type:'asset',sub:'نقدية'}, {code:'1201',name:'الزبائن',type:'asset',sub:'ذمم مدينة'}, {code:'1301',name:'المخزون',type:'asset',sub:'أصول متداولة'}, {code:'1501',name:'الأثاث والمعدات',type:'asset',sub:'أصول ثابتة'},
 {code:'1401',name:'ضريبة مدخلات قابلة للاسترداد',type:'asset',sub:'أصول متداولة'}, {code:'2101',name:'المجهزون',type:'liability',sub:'ذمم دائنة'}, {code:'2201',name:'ضريبة مستحقة',type:'liability',sub:'التزامات متداولة'}, {code:'2202',name:'استقطاعات رواتب مستحقة',type:'liability',sub:'التزامات متداولة'}, {code:'2203',name:'رواتب مستحقة الدفع',type:'liability',sub:'التزامات متداولة'}, {code:'3101',name:'رأس المال',type:'equity',sub:'حقوق ملكية'}, {code:'3102',name:'حساب الأرصدة الافتتاحية',type:'equity',sub:'حقوق ملكية'}, {code:'3201',name:'الأرباح المحتجزة',type:'equity',sub:'حقوق ملكية'},
 {code:'4101',name:'إيرادات المبيعات',type:'revenue',sub:'إيرادات تشغيلية'}, {code:'4201',name:'إيرادات خدمات',type:'revenue',sub:'إيرادات تشغيلية'}, {code:'5101',name:'تكلفة البضاعة المباعة',type:'expense',sub:'تكاليف مباشرة'}, {code:'5201',name:'المشتريات',type:'expense',sub:'تكاليف مباشرة'}, {code:'6101',name:'الرواتب والأجور',type:'expense',sub:'مصروفات تشغيلية'}, {code:'6102',name:'الإيجار',type:'expense',sub:'مصروفات تشغيلية'}, {code:'6103',name:'النقل والاتصالات',type:'expense',sub:'مصروفات تشغيلية'}, {code:'6104',name:'مصروفات عامة',type:'expense',sub:'مصروفات تشغيلية'}
];
const typeNames={asset:'الأصول',liability:'الالتزامات',equity:'حقوق الملكية',revenue:'الإيرادات',expense:'المصروفات'};
let state=load(); let page='dashboard';
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.accounts){x.company={name:'شركتي',currency:'د.ع',phone:'',address:'',fiscalStart:'01-01',...(x.company||{})};x.entries||=[];x.documents||=[];x.contacts||=[];x.products||=[];x.stockMovements||=[];x.employees||=[];x.payroll||=[];accountSeed.forEach(seed=>{if(!x.accounts.some(a=>a.code===seed.code))x.accounts.push({...seed,id:uid()});});return x;}}catch(e){}return {company:{name:'شركتي',currency:'د.ع',phone:'',address:'',fiscalStart:'01-01'},accounts:accountSeed.map(a=>({...a,id:uid()})),entries:[],documents:[],contacts:[],products:[],stockMovements:[],employees:[],payroll:[]};}
function save(){localStorage.setItem(KEY,JSON.stringify(state));notifyOverdue();}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(n){return new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:0}).format(Number(n||0))+' '+(state.company.currency||'د.ع');}
function dateISO(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function iso(){return dateISO(new Date())}
function addMonths(date,n){let d=new Date((date||iso())+'T00:00:00');let day=d.getDate();d.setMonth(d.getMonth()+n);if(d.getDate()<day)d.setDate(0);return dateISO(d)}
function fmtDate(s){try{return new Date(s+'T00:00:00').toLocaleDateString('ar-IQ')}catch(e){return s||''}}
function cashAccounts(){return state.accounts.filter(a=>a.code==='1101'||a.code==='1102')}
function accountName(id){return state.accounts.find(a=>a.id===id)?.name||'—'}
function entryNumberExists(number){return state.entries.some(e=>String(e.number)===String(number))}
function amountFor(accountId){let d=0,c=0;state.entries.forEach(e=>(e.lines||[]).forEach(l=>{if(l.accountId===accountId){d+=+l.debit||0;c+=+l.credit||0}}));return d-c}
function normalBalance(a){let n=amountFor(a.id);return ['liability','equity','revenue'].includes(a.type)?-n:n}
function sumType(t){return state.accounts.filter(a=>a.type===t).reduce((s,a)=>s+normalBalance(a),0)}
function fmtTitle(p){return ({dashboard:'لوحة التحكم',journal:'القيود اليومية',accounts:'دليل الحسابات',sales:'المبيعات والفواتير',purchases:'المشتريات',installments:'الأقساط والاستحقاقات',treasury:'الصندوق والبنوك',inventory:'المخزون',payroll:'الموظفون والرواتب',contacts:'الزبائن والمجهزون',reports:'التقارير المالية',settings:'إعدادات الشركة'})[p]||'HA محاسبة'}
function go(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('topTitle').textContent=fmtTitle(p);document.getElementById('sidebar').classList.remove('open');render();}
function render(){const v=document.getElementById('view');v.innerHTML=({dashboard:dashboard,journal:journalPage,accounts:accountsPage,sales:()=>docsPage('sale'),purchases:()=>docsPage('purchase'),installments:installmentsPage,treasury:treasuryPage,inventory:inventoryPage,payroll:payrollPage,contacts:contactsPage,reports:reportsPage,settings:settingsPage})[page]();bindView();}
function head(title,desc,button=''){return `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div>${button}</div>`}
function stat(label,value,change,tint){return `<article class="stat" style="--tint:${tint||'#e1f5f1'}"><div class="label">${label}</div><div class="value">${value}</div><div class="change">${change||''}</div></article>`}
function table(headers,rows,empty='لا توجد بيانات بعد'){return `<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`}
function dashboard(){let rev=sumType('revenue'),exp=sumType('expense'),cash=state.accounts.filter(a=>a.code==='1101'||a.code==='1102').reduce((s,a)=>s+amountFor(a.id),0),ar=state.accounts.filter(a=>a.code==='1201').reduce((s,a)=>s+amountFor(a.id),0);let months=[];for(let i=5;i>=0;i--){let d=new Date();d.setMonth(d.getMonth()-i);let m=d.getMonth(),y=d.getFullYear();let r=0,e=0;state.entries.filter(x=>{let z=new Date(x.date+'T00:00:00');return z.getMonth()===m&&z.getFullYear()===y}).forEach(x=>x.lines.forEach(l=>{let a=state.accounts.find(a=>a.id===l.accountId);if(a?.type==='revenue')r+=+l.credit||0;if(a?.type==='expense')e+=+l.debit||0}));months.push({name:d.toLocaleDateString('ar-IQ',{month:'short'}),r,e});}let max=Math.max(1,...months.flatMap(x=>[x.r,x.e]));let bars=months.map(x=>`<div class="bar-group"><div style="height:100%;display:flex;align-items:end;gap:4px"><div class="bar" style="height:${Math.max(3,x.r/max*85)}%" title="إيراد ${money(x.r)}"></div><div class="bar" style="height:${Math.max(3,x.e/max*85)}%;background:linear-gradient(#e5bc6c,#cb9340)" title="مصروف ${money(x.e)}"></div></div><span class="bar-label">${x.name}</span></div>`).join('');let recent=state.entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(e=>`<tr><td>${esc(e.number)}</td><td>${fmtDate(e.date)}</td><td>${esc(e.memo||'قيد يومي')}</td><td class="num">${money(e.total)}</td><td><span class="tag">مرحل</span></td></tr>`).join('');return `${head('مرحباً بك في ${esc(state.company.name)}','نظرة عامة على حركة الحسابات والأداء المالي')}
<div class="cards">${stat('إجمالي الإيرادات',money(rev),'حسب القيود المرحلة','#dff4ef')}${stat('إجمالي المصروفات',money(exp),'حسب القيود المرحلة','#fff1d8')}${stat('صافي الربح',money(rev-exp),rev-exp>=0?'الإيرادات مطروحاً منها المصروفات':'المصروفات أعلى من الإيرادات','#e6edfb')}${stat('النقدية بالصندوق والمصرف',money(cash),'أرصدة دفتر الأستاذ','#f3e9ff')}</div>

function journalPage(){let rows=state.entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<tr><td>${esc(e.number)}</td><td>${fmtDate(e.date)}</td><td>${esc(e.memo||'—')}</td><td>${e.lines.length} حسابات</td><td class="num">${money(e.total)}</td><td><span class="tag">مرحل</span></td><td><div class="actions"><button data-view-entry="${e.id}">عرض</button><button data-delete-entry="${e.id}">حذف</button></div></td></tr>`).join('');return `${head('القيود اليومية','تسجيل العمليات المالية ومراجعة تفاصيل المدين والدائن','<button class="btn" data-add="journal">＋ قيد جديد</button>')}<div class="notice">يجب أن يتساوى إجمالي المدين مع إجمالي الدائن قبل ترحيل أي قيد. الحذف يعكس أثر القيد على التقارير.</div><div class="toolbar"><input class="input search" id="journalSearch" placeholder="بحث برقم القيد أو البيان"><input class="input" type="date" id="journalDate"></div><section class="panel">${table(['رقم القيد','التاريخ','البيان','الأسطر','المدين = الدائن','الحالة','إجراء'],rows,'أضف أول قيد يومية لبدء السجل')}</section>`}
function accountsPage(){let rows=state.accounts.slice().sort((a,b)=>a.code.localeCompare(b.code)).map(a=>`<tr><td>${esc(a.code)}</td><td>${esc(a.name)}</td><td><span class="tag ${a.type==='expense'?'gold':''}">${typeNames[a.type]}</span></td><td>${esc(a.sub||'—')}</td><td class="num">${money(normalBalance(a))}</td><td><div class="actions"><button data-view-ledger="${a.id}">كشف</button><button data-edit-account="${a.id}">تعديل</button>${!accountSeed.some(x=>x.code===a.code)?`<button data-delete-account="${a.id}">حذف</button>`:''}</div></td></tr>`).join('');return `${head('دليل الحسابات','التصنيف المحاسبي للأصول والالتزامات وحقوق الملكية والإيرادات والمصروفات','<button class="btn" data-add="account">＋ حساب جديد</button>')}<div class="cards">${Object.entries(typeNames).map(([t,n])=>stat(n,state.accounts.filter(a=>a.type===t).length+' حساب','ضمن دليل الحسابات',t==='expense'?'#fff1d8':'#e1f5f1')).join('')}</div><section class="panel"><div class="panel-head"><h2>الحسابات</h2><span>الأرصدة مستخرجة من دفتر اليومية</span></div>${table(['رمز الحساب','اسم الحساب','التصنيف','المجموعة','الرصيد','إجراء'],rows)}</section>`}
function docDue(d){if(d.installments?.length)return d.installments.reduce((s,x)=>s+Math.max(0,(+x.amount||0)-(+x.paid||0)),0);return Math.max(0,(+d.amount||0)-(+d.downPayment||0)-(+d.payments||0));}
function docSettlementLabel(d){if(docDue(d)<=0)return 'مكتمل';if(d.paymentMode==='installment')return 'أقساط';if(d.paymentMode==='cash')return 'نقدي';return 'آجل';}
function docsPage(kind){let sale=kind==='sale',name=sale?'المبيعات والفواتير':'المشتريات';let ds=state.documents.filter(d=>d.kind===kind).sort((a,b)=>b.date.localeCompare(a.date));let rows=ds.map(d=>`<tr data-doc-date="${d.date}"><td>${esc(d.number)}</td><td>${fmtDate(d.date)}</td><td>${esc(d.party||'—')}</td><td>${esc(d.memo||'—')}</td><td class="num">${money(d.amount)}</td><td class="num">${money(docDue(d))}</td><td><span class="tag ${docDue(d)>0?'gold':''}">${docSettlementLabel(d)}</span></td><td><div class="actions"><button data-view-doc="${d.id}">عرض</button><button data-delete-doc="${d.id}">حذف</button></div></td></tr>`).join('');return `${head(name,sale?'إدارة فواتير البيع والإيرادات والذمم المدينة':'تسجيل فواتير الشراء والمصروفات والذمم الدائنة',`<button class="btn" data-add="${kind}">＋ ${sale?'فاتورة مبيعات':'فاتورة مشتريات'}</button>`)}<div class="cards">${stat(sale?'عدد فواتير البيع':'عدد فواتير الشراء',ds.length,'ضمن السجل الحالي')}${stat('إجمالي القيمة',money(ds.reduce((s,d)=>s+d.amount,0)),'قبل أي خصومات')}${stat(sale?'المبالغ المستحقة من الزبائن':'المبالغ المستحقة للمجهزين',money(ds.reduce((s,d)=>s+docDue(d),0)),'الأرصدة غير المسددة','#fff1d8')}${stat('الفواتير المكتملة',ds.filter(d=>docDue(d)<=0).length,'تم سدادها بالكامل','#e6edfb')}</div><section class="panel"><div class="toolbar"><input class="input search" placeholder="بحث برقم الفاتورة أو الطرف" id="docSearch"><input class="input" type="date" id="docDate"></div>${table(['رقم الفاتورة','التاريخ',sale?'الزبون':'المجهز','البيان','الإجمالي','المتبقي','طريقة السداد','إجراء'],rows,'لا توجد فواتير مسجلة')}</section><p class="hint">الفواتير النقدية والآجلة والأقساط تُرحّل بقيود مزدوجة. سجّل الدفعات الجزئية أو راجع مواعيدها من صفحة الأقساط والاستحقاقات.</p>`}
function installmentStatus(d,p){if(+p.amount-(+p.paid||0)<=0)return ['مسدد',''];if(p.dueDate<iso())return ['متأخر','red'];if(p.dueDate===iso())return ['مستحق اليوم','gold'];return ['قادم',''];}
const overdueNoticeOptIn='ha-accounting-overdue-notifications',overdueNoticeSent='ha-accounting-overdue-last';
function overdueItems(){let items=[];state.documents.forEach(d=>{if(d.installments?.length){d.installments.forEach(p=>{let left=Math.max(0,(+p.amount||0)-(+p.paid||0));if(left>0&&p.dueDate<iso())items.push({key:`${d.id}:${p.id}`,number:d.number,party:d.party||'—',due:p.dueDate,left});});}else if(d.paymentMode==='credit'&&docDue(d)>0){let due=d.firstDue||d.date;if(due<iso())items.push({key:`${d.id}:credit`,number:d.number,party:d.party||'—',due,left:docDue(d)});}});return items;}
function notifyOverdue(){if(typeof Notification==='undefined'||Notification.permission!=='granted'||localStorage.getItem(overdueNoticeOptIn)!=='on')return;let items=overdueItems();if(!items.length){localStorage.removeItem(overdueNoticeSent);return;}let today=iso(),sent={};try{let saved=JSON.parse(localStorage.getItem(overdueNoticeSent)||'{}');if(saved.date===today)sent=saved.items||{};}catch{}let fresh=items.filter(x=>!sent[x.key]);if(!fresh.length)return;fresh.forEach(x=>sent[x.key]=true);localStorage.setItem(overdueNoticeSent,JSON.stringify({date:today,items:sent}));let names=fresh.slice(0,3).map(x=>`${x.number} (${money(x.left)})`).join('، '),more=fresh.length>3?`، و${fresh.length-3} أخرى`:'';let n=new Notification('تنبيه استحقاقات متأخرة',{body:`${fresh.length} استحقاق متأخر: ${names}${more}`,tag:'ha-accounting-overdue'});n.onclick=()=>{window.focus();go('installments');n.close();};}
function enableOverdueNotifications(){if(typeof Notification==='undefined'){alert('هذا المتصفح لا يدعم إشعارات سطح المكتب.');return;}if(Notification.permission==='denied'){alert('إشعارات هذا الموقع محظورة من إعدادات المتصفح. غيّر الإذن من إعدادات الموقع ثم جرّب مرة ثانية.');return;}Notification.requestPermission().then(permission=>{if(permission==='granted'){localStorage.setItem(overdueNoticeOptIn,'on');localStorage.removeItem(overdueNoticeSent);notifyOverdue();alert('تم تفعيل إشعارات الاستحقاق على هذا الجهاز.');}else alert('لم تسمح بإشعارات المتصفح؛ ستبقى الاستحقاقات ظاهرة داخل صفحة الأقساط.');}).catch(()=>alert('تعذر تفعيل إشعارات المتصفح.'));}
function installmentsPage(){let rows=[];state.documents.forEach(d=>{if((d.installments||[]).length){d.installments.forEach((p,i)=>{let [label,cls]=installmentStatus(d,p),left=Math.max(0,p.amount-(+p.paid||0));rows.push(`<tr><td>${esc(d.number)}</td><td>${esc(d.party||'—')}</td><td>${d.kind==='sale'?'مبيعات':'مشتريات'}</td><td>${i+1} / ${d.installments.length}</td><td>${fmtDate(p.dueDate)}</td><td class="num">${money(p.amount)}</td><td class="num">${money(p.paid||0)}</td><td class="num">${money(left)}</td><td><span class="tag ${cls}">${label}</span></td><td>${left>0?`<button class="btn small" data-settle-installment="${d.id}::${p.id}">تسجيل دفعة</button>`:'—'}</td></tr>`);});}else if(d.paymentMode==='credit'&&docDue(d)>0){let due=d.firstDue||d.date;rows.push(`<tr><td>${esc(d.number)}</td><td>${esc(d.party||'—')}</td><td>${d.kind==='sale'?'مبيعات':'مشتريات'}</td><td>آجل</td><td>${fmtDate(due)}</td><td class="num">${money(d.amount)}</td><td class="num">${money(d.payments||0)}</td><td class="num">${money(docDue(d))}</td><td><span class="tag gold">${due<iso()?'متأخر':'آجل'}</span></td><td><button class="btn small" data-settle-installment="${d.id}::credit">تسجيل دفعة</button></td></tr>`);}});let overdue=0,open=0;state.documents.forEach(d=>{if(d.installments?.length)d.installments.forEach(p=>{let left=Math.max(0,p.amount-(+p.paid||0));open+=left;if(left&&p.dueDate<iso())overdue+=left;});else if(d.paymentMode==='credit'){open+=docDue(d);if((d.firstDue||d.date)<iso())overdue+=docDue(d);}});return `${head('الأقساط والاستحقاقات','متابعة الدفعات الجزئية، تواريخ الاستحقاق، والمبالغ المتبقية') }<div class="cards">${stat('إجمالي المبالغ المستحقة',money(open),'مبالغ غير مسددة','#fff1d8')}${stat('المبالغ المتأخرة',money(overdue),'تجاوزت تاريخ الاستحقاق','#ffe9e7')}${stat('خطط الأقساط',state.documents.filter(d=>d.installments?.length).length,'فواتير مقسطة')}${stat('فواتير آجلة',state.documents.filter(d=>d.paymentMode==='credit'&&docDue(d)>0).length,'بانتظار التحصيل أو السداد')}</div><section class="panel"><div class="panel-head"><h2>جدول الأقساط والدفعات</h2><span>تُسجل كل دفعة كقيد محاسبي</span></div>${table(['الفاتورة','الطرف','النوع','القسط','الاستحقاق','قيمة القسط','المدفوع','المتبقي','الحالة','إجراء'],rows,'لا توجد أقساط أو فواتير آجلة')}</section><div class="notice" style="margin-top:16px">فعّل إشعار المتصفح حتى يصلك تنبيه على هذا الجهاز عند وجود قسط أو فاتورة متأخرة. يجب أن تكون صفحة المحاسبة مفتوحة، وأن تسمح بإشعارات المتصفح. <button class="btn secondary" data-enable-overdue-notifications style="margin-inline-start:8px">🔔 تفعيل الإشعارات</button></div><p class="hint">تُنشأ الأقساط شهرياً من تاريخ الاستحقاق الأول. يمكن تسجيل دفعة جزئية، ويُعاد حساب المتبقي وحالة الاستحقاق تلقائياً.</p>`}
function treasuryPage(){let cash=state.accounts.filter(a=>a.code==='1101'||a.code==='1102');let total=cash.reduce((s,a)=>s+amountFor(a.id),0);let rows=state.entries.filter(e=>e.source==='treasury').sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<tr><td>${esc(e.number)}</td><td>${fmtDate(e.date)}</td><td>${esc(e.memo)}</td><td><span class="tag ${e.kind==='payment'?'red':''}">${e.kind==='receipt'?'سند قبض':e.kind==='transfer'?'تحويل داخلي':'سند صرف'}</span></td><td class="num">${money(e.total)}</td><td>${esc(accountName(e.cashId))}</td><td><button class="btn secondary small" data-delete-entry="${e.id}">حذف</button></td></tr>`).join('');return `${head('الصندوق والبنوك','إدارة أرصدة النقدية وحركة القبض والصرف والتحويلات','<button class="btn" data-add="receipt">＋ سند قبض</button>')}<div class="cards">${cash.map(a=>stat(a.name,money(amountFor(a.id)),'رصيد الحساب')).join('')}${stat('إجمالي النقدية',money(total),'الصندوق + المصرف')}</div><section class="panel"><div class="panel-head"><h2>حركة الصندوق والبنوك</h2><div class="actions"><button class="btn small" data-add="receipt">＋ قبض</button><button class="btn secondary small" data-add="payment">− صرف</button><button class="btn secondary small" data-add="transfer">⇄ تحويل</button></div></div>${table(['رقم السند','التاريخ','البيان','النوع','المبلغ','الحساب النقدي','إجراء'],rows,'لا توجد سندات قبض أو صرف')}</section><section class="panel"><div class="panel-head"><h2>أرصدة الحسابات النقدية</h2></div>${table(['رمز الحساب','الحساب','الرصيد الحالي'],cash.map(a=>`<tr><td>${a.code}</td><td>${esc(a.name)}</td><td class="num">${money(amountFor(a.id))}</td></tr>`).join(''))}</section>`}

function normalBalanceAt(a,to){let d=0,c=0;state.entries.filter(e=>e.date<=to).forEach(e=>(e.lines||[]).forEach(l=>{if(l.accountId===a.id){d+=+l.debit||0;c+=+l.credit||0}}));return ['liability','equity','revenue'].includes(a.type)?c-d:d-c;}

function reportsPage(){let range=state.reportRange||defaultReportRange(),from=range.from,to=range.to,assets=sumTypeAt('asset',to),liabs=sumTypeAt('liability',to),equity=sumTypeAt('equity',to),revenue=sumTypePeriod('revenue',from,to),expenses=sumTypePeriod('expense',from,to),profitToDate=sumTypePeriod('revenue',fiscalYearStart(to),to)-sumTypePeriod('expense',fiscalYearStart(to),to),balanceCheck=assets-liabs-equity-profitToDate,unbalanced=state.entries.filter(e=>Math.abs((e.lines||[]).reduce((n,l)=>n+(+l.debit||0),0)-(e.lines||[]).reduce((n,l)=>n+(+l.credit||0),0))>.01).length;return `${head('التقارير المالية','الفترة المحددة · ميزان المراجعة حتى تاريخ التقرير وقائمة الدخل للفترة','<button class="btn secondary" onclick="window.print()">طباعة التقرير</button>')}<div class="toolbar"><label class="hint">الفترة من</label><input class="input" type="date" id="reportFrom" value="${from}"><label class="hint">إلى</label><input class="input" type="date" id="reportTo" value="${to}"><button class="btn small" id="refreshReport">تحديث</button></div><div class="cards">${stat('إجمالي الأصول حتى '+fmtDate(to),money(assets),'ميزان المراجعة')}${stat('إجمالي الالتزامات حتى '+fmtDate(to),money(liabs),'ميزان المراجعة')}${stat('صافي نتيجة الفترة',money(revenue-expenses),'قائمة الدخل')}${stat('توازن الميزانية حتى التاريخ',money(balanceCheck),'فرق التوازن بعد نتيجة السنة','#e6edfb')}</div>${unbalanced?`<div class="notice">تنبيه: يوجد ${unbalanced} قيداً غير متوازن؛ راجع القيود قبل الاعتماد على التقارير.</div>`:''}<section class="panel"><div class="panel-head"><h2>ميزان المراجعة</h2><span>الأرصدة حتى ${fmtDate(to)}</span></div>${trialBalance(to)}</section><div class="two-col"><section class="panel"><div class="panel-head"><h2>قائمة الدخل</h2><span>${fmtDate(from)} — ${fmtDate(to)}</span></div><div class="summary-strip"><div><small>إجمالي الإيرادات</small><strong>${money(revenue)}</strong></div><div><small>إجمالي المصروفات</small><strong>${money(expenses)}</strong></div><div><small>صافي الربح / function openingBalanceModal(){let cap=state.accounts.find(a=>a.code==='3102');if(!cap){alert('حساب الأرصدة الافتتاحية غير موجود بدليل الحسابات.');return;}openModal('إدخال الأرصدة الافتتاحية',`<form id="openingForm"><div class="form-grid"><div class="field"><label>تاريخ الأرصدة</label><input name="date" type="date" value="${iso()}" required></div><div class="field"><label>رقم القيد</label><input name="number" value="OB-${new Date().getFullYear()}-${String(state.entries.length+1).padStart(3,'0')}" required></div></div><div class="notice">أدخل الأرصدة المدينة أو الدائنة؛ سيُرحّل الفرق إلى «${esc(cap.name)}». إذا أدخلت أرصدة الزبائن أو المجهزين من شاشة الجهات، لا تكرر حسابي الزبائن والمجهزين هنا.</div><div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px"><b>الحسابات</b><button type="button" class="btn secondary small" id="addOpeningLine">＋ سطر</button></div><div id="openingLines" class="line-items">${openingLine()}${openingLine()}${openingLine()}</div><div class="form-actions"><button type="button" class="btn secondary" id="cancelModal">إلغاء</button><button class="btn">ترحيل الأرصدة</button></div></form>`);let form=document.getElementById('openingForm'),container=document.getElementById('openingLines');document.getElementById('cancelModal').onclick=()=>document.getElementById('modal').close();document.getElementById('addOpeningLine').onclick=()=>container.insertAdjacentHTML('beforeend',openingLine());container.onclick=e=>{if(e.target.closest('.remove-opening-line')&&container.querySelectorAll('.opening-line').length>1)e.target.closest('.opening-line').remove();};form.onsubmit=e=>{e.preventDefault();let fd=new FormData(form),lines=[],dr=0,cr=0,invalid=false;container.querySelectorAll('.opening-line').forEach(r=>{let id=r.querySelector('[name=account]').value,d=+r.querySelector('[name=debit]').value||0,c=+r.querySelector('[name=credit]').value||0;if(d&&c){invalid=true;return;}if(d||c){if(!id){invalid=true;return;}lines.push({accoun function stockModal(){let products=state.products;if(!products.length){alert('أضف بطاقة صنف أولاً.');return;}openModal('حركة مخزون جديدة',`<form id="stockForm"><div class="form-grid"><div class="field"><label>الصنف</label><select name="product">${products.map(p=>`<option value="${p.id}">${esc(p.sku||'')} ${esc(p.name)} · متاح ${p.qty}</option>`).join('')}</select></div><div class="field"><label>نوع الحركة</label><select name="kind"><option value="in">إدخال للمخزون</option><option value="out">إخراج من المخزون</option></select></div><div class="field"><label>التاريخ</label><input name="date" type="date" value="${iso()}" required></div><div class="field"><label>رقم الحركة</label><input name="number" value="ST-${String((state.stockMovements||[]).length+1).padStart(4,'0')}" required></div><div class="field"><label>الكمية</label><input name="qty" type="number" min="0.001" step="any" required></div><div class="field" id="stockCostField"><label>كلفة الوحدة عند الإدخال</label><input name="unitCost" type="number" min="0" step="any" value="0" required></div><div class="field" id="stockContraField"><label>الحساب المقابل للإدخال</label><select name="contra">${accountOptions()}</select></div><div class="field"><label>البيان</label><input name="memo" placeholder="فاتورة مورد / تسوية / استخدام داخلي"></div></div><div class="notice" id="stockNote">إدخال المخزون يرفع رصيد حساب المخزون. الإخراج يسجل تكلفة البضاعة على حساب تكلفة المبيعات.</div><div class="form-actions"><button type="button" class="btn secondary" id="cancelModal">إلغاء</button><button class="btn">ترحيل الحركة</button></div></form>`);let form=document.getElementById('stockForm'),kind=form.querySelector('[name=kind]'),productSelect=form.querySelector('[name=product]');function setKind(){let isIn=kind.value==='in';document.getElementById('stockCostField').classList.toggle('hidden',!isIn);document.getElementById('stockContraField').classList.toggle('hidden',!isIn);document.getElementById('stockNote').textContent=isIn?'إدخال function ledgerModal(accountId){let a=state.accounts.find(x=>x.id===accountId);if(!a)return;let balance=0,rows=[];state.entries.slice().sort((x,y)=>x.date.localeCompare(y.date)).forEach(e=>{(e.lines||[]).filter(l=>l.accountId===accountId).forEach(l=>{let debit=+l.debit||0,credit=+l.credit||0;balance+=['liability','equity','revenue'].includes(a.type)?credit-debit:debit-credit;rows.push(`<tr><td>${fmtDate(e.date)}</td><td>${esc(e.number)}</td><td>${esc(e.memo||'—')}</td><td class="num">${debit?money(debit):'—'}</td><td class="num">${credit?money(credit):'—'}</td><td class="num">${money(balance)}</td></tr>`);});});openModal('كشف حركة حساب · '+esc(a.name),`<div class="summary-strip"><div><small>رمز الحساب</small><strong>${esc(a.code)}</strong></div><div><small>نوع الحساب</small><strong>${typeNames[a.type]}</strong></div><div><small>الرصيد الحالي</small><strong>${money(balance)}</strong></div></div><section style="margin-top:15px">${table(['التاريخ','رقم القيد','البيان','مدين','دائن','الرصيد التراكمي'],rows.join(''),'لا توجد حركة مسجلة لهذا الحساب')}</section><div class="form-actions"><button class="btn secondary" data-print-doc="${d.id}">🖨️ طباعة الفاتورة</button><button class="btn" id="closeModal">إغلاق</button></div>`);}
function contactLedgerModal(id){let c=state.contacts.find(x=>x.id===id);if(!c)return;let customer=c.kind==='customer',docs=state.documents.filter(d=>d.party===c.name&&d.kind===(customer?'sale':'purchase')),items=[];if(+c.balance)items.push({date:c.openingDate||iso(),number:'افتتاحي',memo:'الرصيد الافتتاحي',debit:customer?+c.balance:0,credit:customer?0:+c.balance});docs.forEach(d=>{items.push({date:d.date,number:d.number,memo:'فاتورة · '+(d.memo||''),debit:customer?d.amount:0,credit:customer?0:d.amount});if(d.downPayment)items.push({date:d.date,number:d.number,memo:'دفعة أولى للفاتورة',debit:customer?0:d.downPayment,credit:customer?d.downPayment:0});state.entries.filter(e=>e.source==='settlement'&&e.docId===d.id).forEach(e=>{let amount=e.paymentAmount||e.total;items.push({date:e.date,number:e.number,memo:e.memo,debit:customer?0:amount,credit:customer?amount:0});});});state.entries.filter(e=>e.source==='treasury'&&e.contactId===c.id).forEach(e=>{let acct=state.accounts.find(a=>a.code===(customer?'1201':'2101'));(e.lines||[]).filter(l=>l.accountId===acct?.id).forEach(l=>items.push({date:e.date,number:e.number,memo:e.memo,debit:+l.debit||0,credit:+l.credit||0}));});items.sort((a,b)=>a.date.localeCompare(b.date));let balance=0,rows=items.map(x=>{balance+=x.debit-x.credit;return`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.number)}</td><td>${esc(x.memo)}</td><td class="num">${x.debit?money(x.debit):'—'}</td><td class="num">${x.credit?money(x.credit):'—'}</td><td class="num">${money(customer?balance:-balance)}</td></tr>`}).join('');openModal('كشف حساب · '+esc(c.name),`<div class="summary-strip"><div><small>نوع الطرف</small><strong>${customer?'زبون':'مجهز'}</strong></div><div><small>الرصيد المستحق</small><strong>${money(contactBalance(c))}</strong></div><div><small>الفواتير المرتبطة</small><strong>${docs.length}</strong></div></div><section style="margin-top:15px">${table(['التاريخ','رقم المستند','البيان','مدين','دائن','الرصيد المستحق'],rows,'لا توجد حركات لهذا الطرف')}</sect function printInvoice(id){let d=state.documents.find(x=>x.id===id);if(!d)return;let sale=d.kind==='sale',company=state.company,items=(d.items||[]).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${money((+x.qty||0)*(+x.price||0))}</td></tr>`).join(''),plans=(d.installments||[]).map((p,i)=>`<tr><td>${i+1}</td><td>${fmtDate(p.dueDate)}</td><td>${money(p.amount)}</td><td>${money(p.paid||0)}</td><td>${money(Math.max(0,(+p.amount||0)-(+p.paid||0)))}</td></tr>`).join(''),payMode={cash:'نقدي كامل',credit:'آجل',installment:'أقساط'}[d.paymentMode]||'—';let w=window.open('','_blank','width=900,height=700');if(!w){alert('اسمح بالنوافذ المنبثقة حتى تطبع الفاتورة.');return;}w.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>فاتورة ${esc(d.number)}</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#172b3a;margin:0;padding:32px;font-size:14px}.head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #159a8c;padding-bottom:18px}.head h1{margin:0 0 8px;color:#102a43;font-size:25px}.muted{color:#667788;line-height:1.8}.badge{padding:8px 14px;border-radius:9px;background:#e1f5f1;color:#126d64;font-weight:bold}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.box{border:1px solid #dce5eb;border-radius:9px;padding:10px}.box small{display:block;color:#728092;margin-bottom:6px}.box strong{font-size:15px}table{width:100%;border-collapse:collapse;margin:18px 0}th,td{border:1px solid #dce5eb;padding:10px;text-align:right}th{background:#f1f5f7}.num{text-align:left;white-space:nowrap}.totals{width:min(420px,100%);margin-right:auto}.totals td{padding:8px 10px}.grand{font-size:17px;font-weight:bold;background:#e1f5f1}.note{margin-top:18px;padding:12px;background:#f5f7f8;border-radius:8px;white-space:pre-wrap}.sign{display:flex;justify-content:space-between;margin-top:65px}.sign span{border-top:1px solid #889 function removeDocument(id){let d=state.documents.find(x=>x.id===id);if(!d)return;let moves=(state.stockMovements||[]).filter(m=>m.docId===id);for(let m of moves){if(hasLaterStockMove(m)){alert('لا يمكن حذف الفاتورة لأن للصنف حركات أحدث. احذف الحركات الأحدث أولاً حتى تبقى كلفة المخزون دقيقة.');return;}}if(!confirm('حذف الفاتورة وكل قيودها ودفعاتها وحركات المخزون المرتبطة بها؟'))return;let products=[...new Set(moves.map(m=>m.productId))];state.documents=state.documents.filter(x=>x.id!==id);state.entries=state.entries.filter(x=>x.docId!==id);state.stockMovements=state.stockMovements.filter(x=>x.docId!==id);products.forEach(recalcStock);save();render();}
function delEntry(id){let e=state.entries.find(x=>x.id===id);if(!e)return;if(e.source==='document'&&e.docId){removeDocument(e.docId);return;}if(!confirm('حذف القيد؟ سيُعاد احتساب جميع التقارير والأرصدة.'))return;if(e.source==='stock'&&e.stockMovementId){let m=state.stockMovements.find(x=>x.id===e.stockMovementId);if(m&&hasLaterStockMove(m)){alert('احذف أحدث حركة لهذا الصنف أولاً حتى تبقى كلفة المخزون دقيقة.');return;}state.stockMovements=state.stockMovements.filter(x=>x.id!==e.stockMovementId);state.entries=state.entries.filter(x=>x.id!==id);if(m)recalcStock(m.productId);}else{state.entries=state.entries.filter(x=>x.id!==id);if(e.source==='settlement'&&e.docId){let d=state.documents.find(x=>x.id===e.docId);if(d){if(e.installmentId){let plan=d.installments?.find(p=>p.id===e.installmentId);if(plan)plan.paid=Math.max(0,(+plan.paid||0)-(+e.paymentAmount||0));}else d.payments=Math.max(0,(+d.payments||0)-(+e.paymentAmount||0));d.paid=docDue(d)<=0.001;}}if(e.source==='payroll'){let run=(state.payroll||[]).find(x=>x.entryId===id);if(run)state.entries=state.entries.filter(x=>x.id!==run.settlementEntryId);state.payroll=(state.payroll||[]).filter(x=>x.entryId!==id);}if(e.source==='payroll-settlement'){let run=(state.payroll||[]).find(x=>x.id===e.payrollId);if(run){run.paid=false;run.settlementEntryId=null;}}}save();render();}

function bind(){document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.getElementById('importFile').onchange=e=>{let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let parsed=JSON.parse(reader.result),next=parsed.data||parsed;if(!next.accounts||!next.entries)throw new Error('invalid');if(confirm('استيراد النسخة سيستبدل البيانات الحالية. متابعة؟')){state=next;save();go('dashboard');alert('تم استيراد النسخة بنجاح.');}}catch(err){alert('ملف النسخة غير صالح.');}e.target.value='';};reader.readAsText(file);};document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page);});document.getElementById('modalBody').addEventListener('click',e=>{let cameraButton=e.target.closest('[data-camera-scan]');if(cameraButton){startCameraBarcodeScan(cameraButton.dataset.cameraScan);return;}let posCard=e.target.closest('[data-pos-product]');if(posCard){let p=state.products.find(x=>x.id===posCard.dataset.posProduct),form=document.getElementById('docForm');if(!p||!form)return;let existing=[...form.querySelectorAll('.doc-line')].find(r=>r.querySelector('[name=productId]').value===p.id),selectedQty=existing?(+existing.querySelector('[name=qty]').value||0):0;if(selectedQty>=+p.qty){alert('الكمية المطلوبة وصلت للمتوفر بالمخزون.');return;}let row=existing||[...form.querySelectorAll('.doc-line')].find(r=>!r.querySelector('[name=productId]').value&&!r.querySelector('[name=item]').value);if(!row){document.getElementById('docLines').insertAdjacentHTML('beforeend',docLine());row=document.querySelector('#docLines .doc-line:last-child');}if(existing){row.querySelector('[name=qty]').value=selectedQty+1;row.querySelector('[name=qty]').dispatchEvent(new Event('input',{bubbles:true}));}else{let sel=row.querySelector('[name=productId]');sel.value=p.id;sel.dispatchEvent(new Event('change',{bubbles:true}));row.querySelector('[name=qty]').value=1;row.querySelector('[name=qty]').dispatchEvent(new Event('input',{bubbles:true}));}return;}if(e.target.closest('.remove-line')){let row=e.target.closest('.line-row');if(document.querySelectorAll('#lines .line-row').length>2){row.remove();document.querySelector('[name=debit]')?.dispatchEvent(new Event('input',{bubbles:true}));}}if(e.target.closest('.remove-doc-line')){let row=e.target.closest('.doc-line');if(document.querySelectorAll('.doc-line').length>1){row.remove();document.getElementById('docForm')?.dispatchEvent(new Event('input',{bubbles:true}));}}});}
function bindView(){const v=document.getElementById('view');v.onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.go){go(b.dataset.go);return;}if(b.dataset.enableOverdueNotifications!==undefined){enableOverdueNotifications();return;}if(b.dataset.quick){let q=b.dataset.quick;addModal(q);return;}if(b.dataset.add){addModal(b.dataset.add);return;}if(b.dataset.viewEntry){viewEntry(b.dataset.viewEntry);return;}if(b.dataset.viewDoc){viewDoc(b.dataset.viewDoc);return;}if(b.dataset.printDoc){printInvoice(b.dataset.printDoc);return;}if(b.dataset.deleteEntry){delEntry(b.dataset.deleteEntry);return;}if(b.dataset.deleteDoc){delDoc(b.dataset.deleteDoc);return;}if(b.dataset.settleInstallment){let [docId,planId]=b.dataset.settleInstallment.split('::');recordInstallmentPayment(docId,planId);return;}if(b.dataset.settlePayroll){settlePayroll(b.dataset.settlePayroll);return;}if(b.dataset.viewLedger){ledgerModal(b.dataset.viewLedger);return;}if(b.dataset.editAccount){accountModal(b.dataset.editAccount);return;}if(b.dataset.deleteAccount){let id=b.dataset.deleteAccount;if(state.entries.some(x=>x.lines.some(l=>l.accountId===id))){alert('لا يمكن حذف حساب مرتبط بقيود.');return;}if(confirm('حذف الحساب؟')){state.accounts=state.accounts.filter(a=>a.id!==id);save();render();}return;}if(b.dataset.viewContact){contactLedgerModal(b.dataset.viewContact);return;}if(b.dataset.editContact){contactModal(b.dataset.editContact);return;}if(b.dataset.deleteContact){let c=state.contacts.find(x=>x.id===b.dataset.deleteContact);if(c&&(state.documents.some(d=>d.party===c.name)||state.entries.some(x=>x.contactId===c.id))){alert('لا يمكن حذف جهة مرتبطة بفواتير أو قيود؛ يمكنك تعديل بياناتها بدلاً من ذلك.');return;}if(confirm('حذف الجهة؟')){state.contacts=state.contacts.filter(c=>c.id!==b.dataset.deleteContact);save();render();}return;}if(b.dataset.editEmployee){employeeModal(b.dataset.editEmployee);return;}if(b.dataset.deleteEmployee){let id=b.dataset.deleteEmployee;if((state.payroll||[]).some(x=>x.employeeId===id)){alert('لا يمكن حذف موظف له مسيرات رواتب مسجلة.');return;}if(confirm('حذف الموظف؟')){state.employees=state.employees.filter(x=>x.id!==id);save();render();}return;}if(b.dataset.editProduct){productModal(b.dataset.editProduct);return;}if(b.dataset.deleteProduct){if(confirm('حذف الصنف؟')){state.products=state.products.filter(c=>c.id!==b.dataset.deleteProduct);save();render();}return;}if(b.id==='refreshReport'){let from=v.querySelector('#reportFrom')?.value||defaultReportRange().from,to=v.querySelector('#reportTo')?.value||iso();if(from>to){alert('تاريخ بداية الفترة يجب أن يسبق تاريخ نهايتها.');return;}state.reportRange={from,to};save();render();}};
v.querySelectorAll('form#companyForm').forEach(f=>f.onsubmit=e=>{e.preventDefault();let d=new FormData(f);state.company={...state.company,name:d.get('name'),currency:d.get('currency'),phone:d.get('phone'),address:d.get('address'),fiscalStart:d.get('fiscalStart')};save();document.getElementById('companyShort').textContent=state.company.name;alert('تم حفظ بيانات الشركة');});
v.querySelector('#exportBtn')?.addEventListener('click',exportData);v.querySelector('#importBtn')?.addEventListener('click',()=>document.getElementById('importFile').click());v.querySelector('#resetBtn')?.addEventListener('click',()=>{if(confirm('متأكد؟ سيتم مسح كل القيود والفواتير والحسابات والبيانات المحلية.')){localStorage.removeItem(KEY);state=load();go('dashboard');}});
[['journalSearch',0],['docSearch',0],['docDate',0],['productSearch',1],['contactSearch',0]].forEach(([id,col])=>{let x=v.querySelector('#'+id);if(x)x.oninput=()=>filterTable(x.value,col);});let kind=v.querySelector('#contactKind');if(kind)kind.onchange=()=>{let word=kind.value==='customer'?'زبون':'مجهز';v.querySelectorAll('tbody tr').forEach(tr=>tr.classList.toggle('hidden',!!kind.value&&!tr.textContent.includes(word)));};}
function filterTable(q,col){let date=document.querySelector('#docDate')?.value||'',rows=document.querySelectorAll('#view tbody tr');rows.forEach(r=>r.classList.toggle('hidden',(!!q&&!r.textContent.toLowerCase().includes(q.toLowerCase()))||(!!date&&r.dataset.docDate!==date)))}
document.getElementById('today').textContent=new Date().toLocaleDateString('ar-IQ',{weekday:'long',year:'numeric',month:'long',day:'numeric'});document.getElementById('companyShort').textContent=state.company.name;render();bind();notifyOverdue();setInterval(notifyOverdue,60000);
})();
</script>
<script>if('serviceWorker' in navigator && location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(err=>console.warn('تعذر تفعيل وضع عدم الاتصال',err)));}</script>
