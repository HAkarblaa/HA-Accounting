<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12345a"><title>منيو المطعم</title>
<style>
:root{--navy:#12345a;--blue:#1769aa;--teal:#0b9e98;--bg:#f2f7fb;--ink:#18324a;--muted:#718397;--line:#dce7ef;--gold:#946106;--green:#167452}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,Arial}.top{position:sticky;top:0;background:white;border-bottom:1px solid var(--line);padding:14px 16px;z-index:2}.top h1{font-size:19px;margin:0;color:var(--navy)}.top small{color:var(--muted)}main{max-width:760px;margin:16px auto;padding:0 12px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0}.service-options{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.categories{display:flex;gap:7px;overflow:auto;padding:3px 0 12px}.chip{border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:white;white-space:nowrap;color:var(--navy);font-weight:700}.chip.active{background:var(--navy);color:white}.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.item{border:1px solid var(--line);border-radius:14px;padding:13px;display:grid;gap:6px}.item strong{color:var(--navy)}.price{color:var(--blue);font-weight:850}.add,.send{border:0;border-radius:10px;padding:10px;background:var(--teal);color:#fff;font-weight:800}.cartrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.qty{display:flex;align-items:center;gap:8px}.qty button{border:0;border-radius:8px;padding:5px 10px;background:#eaf3f8;color:var(--navy);font-weight:800}.field{display:grid;gap:5px;margin:10px 0}.field input,.field textarea{border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}.field textarea{min-height:65px}.total{font-size:19px;color:var(--navy);font-weight:900}.notice{padding:11px;border-radius:10px;background:#eff7fc;color:#3f6078;margin-top:10px}.notice.error{background:#fff1ef;color:#9b3830}.status{padding:13px;border-radius:12px;background:#e9f8f0;color:var(--green);font-weight:800}.status.new{background:#fff3dc;color:var(--gold)}.status.preparing{background:#f1eaff;color:#6646a1}.hidden{display:none!important}.muted{font-size:13px;color:var(--muted)}
</style></head><body><header class="top"><h1 id="restaurantName">منيو المطعم</h1><small id="tableName">جارٍ تحميل القائمة…</small></header><main><section id="menuView"><div class="panel"><div id="cats" class="categories"></div><div id="menu" class="menu"></div></div><section class="panel" id="servicePanel"><h2>تحتاج خدمة؟</h2><p class="muted">طلب الخدمة يوصل للويتر فقط، بدون ما يتحول للمطبخ أو الكاشير.</p><div class="service-options"><button class="chip" data-service="waiter">استدعاء الويتر</button><button class="chip" data-service="bill">طلب الحساب</button><button class="chip" data-service="water">ماء</button><button class="chip" data-service="napkins">مناديل أو أدوات</button><button class="chip" data-service="clean">تنظيف الميز</button><button class="chip" data-service="other">أكتب طلب خدمة</button></div><label class="field">إذا طلبك غير موجود، اكتبه هنا<input id="serviceNote" maxlength="200" placeholder="مثال: ممكن تجيبون ملعقة إضافية؟"></label><div id="serviceMessage" class="notice hidden"></div></section><div class="panel"><h2>طلبك</h2><div id="cart"></div><label class="field">ملاحظة للمطبخ<textarea id="note" maxlength="500" placeholder="مثال: بدون بصل"></textarea></label><div class="total" id="total"></div><button class="send" id="send" style="width:100%">إرسال الطلب للمطبخ</button><div id="message" class="notice hidden"></div></div></section><section id="trackingView" class="panel hidden"><h2>متابعة طلبك</h2><div id="orderState" class="status">تم إرسال طلبك للويتر للمراجعة.</div><div id="trackDetails" class="muted"></div><p class="muted">تابع هذه الصفحة لمعرفة حالة الطلب. الدفع عند الكاشير.</p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script src="./supabase-config.js"></script><script>
(()=>{'use strict';const cfg=window.HA_SUPABASE_CONFIG||{},db=window.supabase?.createClient&&cfg.url&&cfg.publishableKey?window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:false,autoRefreshToken:false}}):null,token=new URLSearchParams(location.search).get('t'),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:0}).format(Number(n)||0)+' د.ع',labels={waiter_review:'وصل طلبك للويتر، بانتظار مراجعته',new:'تم تأكيد الطلب وإرساله للمطبخ',preparing:'قيد التحضير',ready:'الطلب جاهز — راجع الكاشير للدفع',paid:'تم الدفع',cancelled:'أُلغي الطلب'};let menu=[],cart=[],category='الكل',poll=null;
function say(text,error=false){let x=$('#message');x.textContent=text;x.className='notice'+(error?' error':'');x.classList.remove('hidden');}
function draw(){let cats=['الكل',...new Set(menu.map(x=>x.category||'عام'))];if(!cats.includes(category))category='الكل';$('#cats').innerHTML=cats.map(c=>`<button class="chip ${c===category?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');$('#menu').innerHTML=menu.filter(x=>category==='الكل'||(x.category||'عام')===category).map(m=>`<article class="item"><strong>${esc(m.name)}</strong><span class="muted">${esc(m.category||'عام')}</span><span class="price">${money(m.price)}</span><button class="add" data-add="${esc(m.id)}">إضافة</button></article>`).join('')||'<p class="muted">ماكو أصناف متاحة حالياً.</p>';$('#cart').innerHTML=cart.map((x,i)=>`<div class="cartrow"><div><b>${esc(x.name)}</b><div class="muted">${money(x.price)} للواحد</div><label class="muted">ملاحظة الصنف<input data-note="${i}" value="${esc(x.note)}" maxlength="200" placeholder="اختياري"></label></div><div class="qty"><button data-qty="${i}:-1">−</button><b>${x.qty}</b><button data-qty="${i}:1">+</button></div></div>`).join('')||'<p class="muted">اختَر الأصناف من القائمة.</p>';$('#total').textContent='المجموع: '+money(cart.reduce((s,x)=>s+x.price*x.qty,0));}
async function load(){if(!db||!token)throw Error('رابط المنيو غير مكتمل. امسح QR الموجود على طاولتك مرة ثانية.');let {data,error}=await db.rpc('ha_restaurant_guest_menu',{p_token:token});if(error)throw error;$('#restaurantName').textContent=data.restaurant_name||'منيو المطعم';$('#tableName').textContent='الطاولة: '+data.table_label;menu=data.menu||[];draw();}
$('#servicePanel').onclick=async e=>{let b=e.target.closest('[data-service]');if(!b)return;let type=b.dataset.service,note=$('#serviceNote').value.trim();if(type==='other'&&!note){$('#serviceNote').focus();$('#serviceMessage').textContent='اكتب طلب الخدمة بالخانة أولاً.';$('#serviceMessage').classList.remove('hidden');return;}if(!navigator.onLine){$('#serviceMessage').textContent='الإنترنت مقطوع؛ ما وصل طلب الخدمة للويتر.';$('#serviceMessage').classList.remove('hidden');return;}b.disabled=true;try{let {error}=await db.rpc('ha_restaurant_guest_create_service_request',{p_token:token,p_type:type,p_note:note});if(error)throw error;$('#serviceMessage').textContent='وصل طلب الخدمة للويتر.';$('#serviceMessage').className='notice';$('#serviceMessage').classList.remove('hidden');if(type==='other')$('#serviceNote').value='';}catch(x){$('#serviceMessage').textContent=x.message||'تعذر إرسال طلب الخدمة.';$('#serviceMessage').className='notice error';$('#serviceMessage').classList.remove('hidden');}finally{b.disabled=false;}};
$('#cats').onclick=e=>{let x=e.target.closest('[data-cat]');if(x){category=x.dataset.cat;draw();}};$('#menu').onclick=e=>{let x=e.target.closest('[data-add]');if(!x)return;let m=menu.find(z=>z.id===x.dataset.add);if(!m)return;let line=cart.find(z=>z.id===m.id);if(line)line.qty++;else cart.push({id:m.id,name:m.name,price:Number(m.price),qty:1,note:''});draw();};$('#cart').onclick=e=>{let x=e.target.closest('[data-qty]');if(!x)return;let [i,d]=x.dataset.qty.split(':').map(Number);cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);draw();};$('#cart').oninput=e=>{let n=e.target.closest('[data-note]');if(n)cart[+n.dataset.note].note=n.value;};
$('#send').onclick=async()=>{if(!navigator.onLine){say('الإنترنت مقطوع؛ ما وصل الطلب للمطعم. اتصل بالإنترنت وجرب الإرسال من جديد.',true);return;}if(!cart.length){say('أضف صنفاً واحداً على الأقل.',true);return;}let b=$('#send');b.disabled=true;try{let {data,error}=await db.rpc('ha_restaurant_guest_create_order',{p_token:token,p_note:$('#note').value.trim(),p_items:cart.map(x=>({menu_item_id:x.id,qty:x.qty,note:x.note}))});if(error)throw error;$('#menuView').classList.add('hidden');$('#trackingView').classList.remove('hidden');await refreshStatus(data.tracking_token);poll=setInterval(()=>refreshStatus(data.tracking_token).catch(()=>{}),9000);}catch(e){say(e.message||'تعذر إرسال الطلب. حاول مرة ثانية.',true);}finally{b.disabled=false;}};
async function refreshStatus(ticket){let {data,error}=await db.rpc('ha_restaurant_guest_order_status',{p_tracking_token:ticket});if(error)throw error;let state=$('#orderState');state.textContent=labels[data.status]||data.status;state.className='status '+data.status;$('#trackDetails').textContent='الطاولة '+data.table_label+' · '+(data.items||[]).map(x=>`${x.name} × ${x.quantity}`).join('، ')+' · المجموع '+money(data.total);if(['paid','cancelled'].includes(data.status)&&poll){clearInterval(poll);poll=null;}}
load().catch(e=>say(e.message||'تعذر تحميل المنيو. تأكد من اتصال الإنترنت.',true));
})();
</script></body></html>
